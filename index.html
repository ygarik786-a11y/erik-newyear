<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#0a0e27 0%,#1a1a3e 50%,#0f2027 100%);color:#fff;min-height:100vh;overflow-x:hidden}
.snow{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.container{position:relative;z-index:2;max-width:800px;margin:0 auto;padding:40px 20px;text-align:center}
h1{font-size:2.5em;margin-bottom:10px;text-shadow:0 0 20px rgba(255,215,0,.5)}
.subtitle{color:#aaa;margin-bottom:40px;font-size:1.1em}
.countdown{display:flex;justify-content:center;gap:15px;margin-bottom:50px;flex-wrap:wrap}
.time-box{background:#1a1a1a;border:3px solid #333;border-radius:16px;padding:20px;min-width:110px;box-shadow:inset 0 0 20px rgba(0,0,0,.8)}
.time-num{font-size:3em;font-weight:bold;color:#aaff00;text-shadow:0 0 8px rgba(170,255,0,.8),0 0 20px rgba(170,255,0,.4);font-variant-numeric:tabular-nums;font-family:'Courier New',monospace;letter-spacing:2px;background:#0a0f0a;padding:8px;border-radius:8px}
.time-label{color:#aaa;margin-top:8px;font-size:.9em;text-transform:uppercase;letter-spacing:1px}
.clocks{display:flex;justify-content:center;gap:20px;margin-bottom:50px;flex-wrap:wrap}
.clock-card{background:#1a1a1a;border-radius:16px;padding:25px 30px;border:3px solid #333;box-shadow:inset 0 0 20px rgba(0,0,0,.8)}
.clock-time{font-size:2.8em;font-family:'Courier New',monospace;font-weight:bold;color:#aaff00;text-shadow:0 0 8px rgba(170,255,0,.8),0 0 20px rgba(170,255,0,.4);font-variant-numeric:tabular-nums;letter-spacing:4px;background:#0a0f0a;padding:10px 15px;border-radius:8px}
.clock-label{color:#888;margin-top:8px;font-size:.85em}
.radio{background:rgba(255,255,255,.05);border-radius:20px;padding:30px;margin-bottom:30px;border:1px solid rgba(255,255,255,.1)}
.radio h2{margin-bottom:20px;font-size:1.5em}
.stations{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.station-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:1em;transition:all .3s}
.station-btn:hover{background:rgba(255,255,255,.2)}
.station-btn.active{background:#4CAF50;border-color:#4CAF50}
audio{width:100%;max-width:400px;margin-top:15px;border-radius:10px}
.footer{color:#666;margin-top:40px;font-size:.9em}
.topnav{position:relative;z-index:3;display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap}
.topnav a{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none;padding:10px 18px;border-radius:12px;font-size:.95em;transition:all .3s}
.topnav a:hover{background:rgba(255,255,255,.18)}
.garland{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;padding:15px 0;flex-wrap:wrap}
.garland-light{width:14px;height:14px;border-radius:50%;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1;box-shadow:0 0 12px currentColor}}
.tree{margin-bottom:30px;position:relative;width:200px;height:280px;margin-left:auto;margin-right:auto}
.tree-star{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:36px;animation:spin 4s linear infinite;filter:drop-shadow(0 0 10px gold)}
@keyframes spin{0%,100%{transform:translateX(-50%) rotate(-10deg)}50%{transform:translateX(-50%) rotate(10deg)}}
.tree-layer{position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;border-left:solid transparent;border-right:solid transparent}
.tree-l1{top:30px;border-left-width:50px;border-right-width:50px;border-bottom:70px solid #0d5c2e}
.tree-l2{top:80px;border-left-width:70px;border-right-width:70px;border-bottom:90px solid #0a4a25}
.tree-l3{top:140px;border-left-width:90px;border-right-width:90px;border-bottom:110px solid #083d1f}
.tree-trunk{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:30px;height:40px;background:#5a3a1a;border-radius:4px}
.tree-light{position:absolute;width:10px;height:10px;border-radius:50%;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1;box-shadow:0 0 10px currentColor}}
.tree-ball{position:absolute;width:14px;height:14px;border-radius:50%;box-shadow:inset -2px -2px 4px rgba(0,0,0,.4)}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,215,0,.5))}50%{filter:drop-shadow(0 0 25px rgba(255,215,0,.9))}}
</style>
</head>
<body>
<nav class="topnav"><a href="/">🏠 Главная</a><a href="/countdown.html">⏳ Отсчёты</a><a href="/chat.html">💬 ErikTalk</a><a href="https://eriksocial.pythonanywhere.com">🌐 E.Y.L</a></nav>
<canvas class="snow" id="snow"></canvas>
<div class="garland" id="garland"></div>
<div class="container">
<div class="clocks" style="margin-bottom:30px">
<div class="clock-card"><div class="clock-time" id="clock-local">00:00:00</div><div class="clock-label">Время</div></div>
<div class="clock-card"><div class="clock-time" id="date-today" style="font-size:1.8em">—</div><div class="clock-label" id="holiday-today">📅</div></div>
</div>
<div class="tree" style="width:300px;height:420px">
<div class="tree-star">⭐</div>
<div class="tree-layer tree-l1" style="top:40px;border-left-width:75px;border-right-width:75px;border-bottom-width:105px"></div>
<div class="tree-layer tree-l2" style="top:120px;border-left-width:105px;border-right-width:105px;border-bottom-width:135px"></div>
<div class="tree-layer tree-l3" style="top:210px;border-left-width:135px;border-right-width:135px;border-bottom-width:165px"></div>
<div class="tree-trunk" style="width:45px;height:60px"></div>
<div class="tree-light" style="top:90px;left:45%;color:#ff0000;background:#ff0000"></div>
<div class="tree-light" style="top:130px;left:60%;color:#00ff00;background:#00ff00;animation-delay:.5s"></div>
<div class="tree-light" style="top:170px;left:40%;color:#0000ff;background:#0088ff;animation-delay:1s"></div>
<div class="tree-light" style="top:210px;left:55%;color:#ffff00;background:#ffff00;animation-delay:.3s"></div>
<div class="tree-light" style="top:250px;left:45%;color:#ff00ff;background:#ff00ff;animation-delay:.8s"></div>
<div class="tree-ball" style="top:110px;left:52%;background:#ff0000"></div>
<div class="tree-ball" style="top:190px;left:48%;background:#0000ff"></div>
<div class="tree-ball" style="top:260px;left:58%;background:#ffd700"></div>
</div>
<h1>До Нового Года осталось:</h1>
<p class="subtitle">Erik's New Year Countdown</p>
<div class="countdown">
<div class="time-box"><div class="time-num" id="days">0</div><div class="time-label">дней</div></div>
<div class="time-box"><div class="time-num" id="hours">0</div><div class="time-label">часов</div></div>
<div class="time-box"><div class="time-num" id="minutes">0</div><div class="time-label">минут</div></div>
<div class="time-box"><div class="time-num" id="seconds">0</div><div class="time-label">секунд</div></div>
</div>
<div class="radio">
<h2>📻 Новогоднее радио</h2>
<div class="stations">
<button class="station-btn" data-url="https://christmasfm.cdnstream1.com/2550_128.mp3">🎄 Christmas FM</button>
<button class="station-btn" data-url="https://1000christmashits.stream.laut.fm/1000christmashits">🎅 1000 Christmas Hits</button>
</div>
<audio id="player" controls></audio>
</div>
<p class="footer">© 2026 Erik Lebed 🎄 Сделано с любовью<br><br><a href="https://eriksocial.pythonanywhere.com" style="color:#4CAF50;text-decoration:none;font-size:1.1em">🌐 Наша соцсеть E.Y.L</a> · <a href="/chat.html" style="color:#4CAF50;text-decoration:none;font-size:1.1em">💬 ErikTalk</a></p>
</div>
<script>
// Гирлянда
(function(){const g=document.getElementById('garland');const colors=['#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff','#ff8800'];for(let i=0;i<30;i++){const l=document.createElement('div');l.className='garland-light';const c=colors[i%colors.length];l.style.background=c;l.style.color=c;l.style.animationDelay=(i*0.15)+'s';g.appendChild(l)}})();
// Снег
const c=document.getElementById('snow'),x=c.getContext('2d');let W,H,flakes=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
rs();addEventListener('resize',rs);
for(let i=0;i<150;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,s:Math.random()*2+.5,o:Math.random()*.8+.2});
(function anim(){x.clearRect(0,0,W,H);x.fillStyle='#fff';flakes.forEach(f=>{x.globalAlpha=f.o;x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();f.y+=f.s;f.x+=Math.sin(f.y/50);if(f.y>H){f.y=0;f.x=Math.random()*W}});requestAnimationFrame(anim)})();
// Отсчёт
function cd(){const n=new Date(2027,0,1)-new Date();if(n<0)return;const d=Math.floor(n/864e5),h=Math.floor(n/36e5)%24,m=Math.floor(n/6e4)%60,s=Math.floor(n/1e3)%60;days.textContent=d;hours.textContent=String(h).padStart(2,'0');minutes.textContent=String(m).padStart(2,'0');seconds.textContent=String(s).padStart(2,'0')}
setInterval(cd,1000);cd();
// Часы
function ck(){const n=new Date();document.getElementById('clock-local').textContent=n.toLocaleTimeString('ru-RU')}
setInterval(ck,1000);ck();
// Дата и праздники
function updDate(){const n=new Date();const days=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];document.getElementById('date-today').textContent=days[n.getDay()]+', '+n.getDate()+' '+months[n.getMonth()];const h={'01-01':'🎄 Новый год','01-07':'⭐ Рождество','02-14':'💘 День влюблённых','03-08':'🌷 8 Марта','05-01':'🌿 День труда','05-09':'🎖️ День Победы','12-25':'🎄 Католическое Рождество','12-31':'🎉 Канун Нового года'};const key=String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');document.getElementById('holiday-today').textContent=h[key]||n.getFullYear()}
updDate();setInterval(updDate,1000);
// Радио
const p=document.getElementById('player');
p.preload='none';
document.querySelectorAll('.station-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.station-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');try{p.pause()}catch(e){}p.src=b.dataset.url;p.load();const pr=p.play();if(pr&&pr.catch)pr.catch(e=>{b.textContent+=' (ошибка)';setTimeout(()=>{b.textContent=b.textContent.replace(' (ошибка)','')},3000)})});
p.addEventListener('error',()=>{document.querySelectorAll('.station-btn.active').forEach(b=>{b.textContent+=' ⚠️';setTimeout(()=>{b.textContent=b.textContent.replace(' ⚠️','')},3000)})});
</script>
