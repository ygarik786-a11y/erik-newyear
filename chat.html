<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 ErikTalk — чат</title>
<style>
:root{--bg:#0a0a2e;--card:#141444;--text:#fff;--accent:#4CAF50;--input:#1e1e5a}
body.light{--bg:#f0f0f5;--card:#fff;--text:#222;--input:#e8e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .3s}
header{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:20px}
header .tools{display:flex;gap:8px}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:14px}
.theme-btn{background:var(--input);color:var(--text)}
#login{max-width:400px;margin:40px auto;padding:24px;background:var(--card);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#login h2{text-align:center;margin-bottom:16px}
#login label{display:block;margin:12px 0 4px;font-size:14px}
#login input,#login select{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:var(--input);color:var(--text);font-size:15px}
#login input[type=color]{height:44px;padding:4px}
#join-btn{width:100%;margin-top:16px;background:var(--accent);color:#fff;font-size:16px;padding:12px}
#chat{display:none;flex:1;flex-direction:column;max-width:900px;width:100%;margin:0 auto;padding:12px}
#room-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.room-btn{background:var(--input);color:var(--text);font-size:13px;padding:6px 12px}
.room-btn.active{background:var(--accent);color:#fff}
#main-row{display:flex;gap:10px;flex:1}
#messages{flex:1;overflow-y:auto;background:var(--card);border-radius:12px;padding:12px;min-height:300px;max-height:60vh;margin-bottom:10px}
#online-panel{width:160px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px;max-height:60vh;overflow-y:auto;font-size:14px}
#online-panel h3{font-size:13px;margin-bottom:8px;opacity:.7}
.online-user{margin-bottom:4px;font-weight:600;word-break:break-all}
@media(max-width:600px){#online-panel{width:110px;font-size:12px}}
.msg{margin-bottom:8px;word-wrap:break-word;font-size:15px}
.msg .nick{font-weight:700}
.msg .time{font-size:11px;opacity:.5;margin-left:6px}
#send-form{display:flex;gap:8px}
#msg-input{flex:1;padding:12px;border-radius:10px;border:1px solid #444;background:var(--input);color:var(--text);font-size:15px}
#send-btn{background:var(--accent);color:#fff;font-size:15px}
footer{text-align:center;padding:12px;font-size:12px;opacity:.5}
footer a{color:var(--accent)}
#emoji-btn{background:var(--input);font-size:18px;padding:8px 10px}
#emoji-panel{display:none;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;font-size:22px;line-height:1.9;max-height:150px;overflow-y:auto}
#emoji-panel .em{cursor:pointer;padding:2px}
#emoji-panel .em:hover{transform:scale(1.35);display:inline-block}
.online-user{cursor:pointer}
.online-user:hover{text-decoration:underline}
.msg .nick{cursor:pointer}
.msg .nick:hover{text-decoration:underline}
.dm-chip{background:#9C27B0!important;color:#fff!important}
.adm-tag{background:#FFD700;color:#111;border-radius:6px;padding:0 5px;font-size:10px;font-weight:700;vertical-align:1px;margin-left:4px;white-space:nowrap}
</style>
</head>
<body>
<header>
<h1>💬 ErikTalk</h1>
<div class="tools"><button class="theme-btn" onclick="toggleTheme()">🌙/☀️</button><button class="theme-btn" onclick="cycleLang()">🌐 <span id="lang-cur">RU</span></button></div>
</header>

<div id="login">
<h2>Вход в чат</h2>
<label>Ваш ник:</label>
<input id="nick" maxlength="20" placeholder="Например: Erik">
<label>Ваш цвет:</label>
<input type="color" id="color" value="#4CAF50">
<label>Комната:</label>
<select id="room">
<option value="general">🏠 Общая</option>
<option value="music">🎵 Музыка</option>
<option value="games">🎮 Игры</option>
<option value="random">🎲 Болталка</option>
<option value="links">🔗 Ссылки</option>
</select>
<label>PIN админа (только для Erik, остальным — пусто):</label>
<input id="pin" type="password" maxlength="20" placeholder="Необязательно" autocomplete="off">
<button id="join-btn" onclick="join()">В чат!</button>
</div>

<div id="chat">
<div id="room-bar"></div>
<div id="main-row">
<div id="messages"></div>
<div id="online-panel"><h3 id="online-title">👥 В чате</h3><div id="online-list"></div></div>
</div>
<form id="send-form" onsubmit="sendMsg(event)">
<button type="button" id="emoji-btn" onclick="toggleEmoji()">😊</button>
<input id="msg-input" maxlength="500" placeholder="Написать сообщение..." autocomplete="off">
<button id="send-btn" type="submit">➤</button>
</form>
<div id="emoji-panel"></div>
</div>

<footer><a href="/">🎄 На главную</a> · ErikTalk © 2026</footer>

<script>
const API = "https://eriktalk-api.onrender.com";
let nick="", color="#4CAF50", room="general", baseRoom="general", dmPeer=null, lastId=0, pollTimer=null, adminPin="";

// --- Languages ---
const L = {
ru: {title:"Вход в чат", nickL:"Ваш ник:", colorL:"Ваш цвет:", roomL:"Комната:", join:"В чат!", guest:"Гость", ph:"Написать сообщение...", rooms:{general:"🏠 Общая", music:"🎵 Музыка", games:"🎮 Игры", random:"🎲 Болталка", links:"🔗 Ссылки"}, back:"🎄 На главную", online:"👥 В чате", dmBack:"← Назад", dmHint:"Нажмите на пользователя, чтобы написать ему лично"},
uk: {title:"Вхід у чат", nickL:"Ваш нік:", colorL:"Ваш колір:", roomL:"Кімната:", join:"У чат!", guest:"Гість", ph:"Написати повідомлення...", rooms:{general:"🏠 Загальна", music:"🎵 Музика", games:"🎮 Ігри", random:"🎲 Балаканина", links:"🔗 Посилання"}, back:"🎄 На головну", online:"👥 У чаті", dmBack:"← Назад", dmHint:"Натисніть на користувача, щоб написати йому особисто"},
en: {title:"Join chat", nickL:"Your nick:", colorL:"Your color:", roomL:"Room:", join:"Join!", guest:"Guest", ph:"Type a message...", rooms:{general:"🏠 General", music:"🎵 Music", games:"🎮 Games", random:"🎲 Random", links:"🔗 Links"}, back:"🎄 Home", online:"👥 Online", dmBack:"← Back", dmHint:"Click a user to message them privately"}
};
let lang = localStorage.getItem("et-lang") || "ru";
function t(k){return L[lang][k]}
function cycleLang(){lang = lang==="ru"?"uk":lang==="uk"?"en":"ru";localStorage.setItem("et-lang",lang);applyLang();}
function applyLang(){
  document.getElementById("lang-cur").textContent=lang.toUpperCase();
  document.querySelector("#login h2").textContent=t("title");
  document.querySelectorAll("#login label")[0].textContent=t("nickL");
  document.querySelectorAll("#login label")[1].textContent=t("colorL");
  document.querySelectorAll("#login label")[2].textContent=t("roomL");
  document.getElementById("join-btn").textContent=t("join");
  document.getElementById("msg-input").placeholder=t("ph");
  document.querySelector("footer a").textContent=t("back");
  document.getElementById("online-title").textContent=t("online");
  renderRooms();
}

function toggleTheme(){document.body.classList.toggle("light");localStorage.setItem("et-theme",document.body.classList.contains("light")?"light":"dark")}
const rooms=[["general","general"],["music","music"],["games","games"],["random","random"],["links","links"]];
if(localStorage.getItem("et-theme")==="light")document.body.classList.add("light");
if(localStorage.getItem("et-nick"))document.getElementById("nick").value=localStorage.getItem("et-nick");
applyLang();
function renderRooms(){
  let h=rooms.map(r=>`<button class="room-btn${r[0]===room?' active':''}" onclick="switchRoom('${r[0]}')">${t("rooms")[r[0]]}</button>`).join("");
  if(dmPeer)h+=` <button class="room-btn dm-chip" onclick="closeDM()">${t("dmBack")} 💌 ${esc(dmPeer)}</button>`;
  document.getElementById("room-bar").innerHTML=h;
}
function switchRoom(r){baseRoom=r;dmPeer=null;room=r;lastId=0;document.getElementById("messages").innerHTML="";renderRooms();loadMsgs();}

// --- Личка: клик по пользователю открывает DM (отдельная комната dm_<хэш>) ---
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0");}
function dmRoom(a,b){const s=[a.toLowerCase(),b.toLowerCase()].sort().join("|");return "dm_"+cyrb53(s);}
function openDM(peer){
  if(!peer||peer===nick)return;
  dmPeer=peer;room=dmRoom(nick,peer);lastId=0;
  document.getElementById("messages").innerHTML="";
  document.getElementById("emoji-panel").style.display="none";
  renderRooms();loadMsgs();
}
function closeDM(){dmPeer=null;room=baseRoom;lastId=0;document.getElementById("messages").innerHTML="";renderRooms();loadMsgs();}

// --- Смайлики: панель 0 КБ, вставка в позицию курсора ---
const EMOJIS="😀😁😂🤣😊😉😍😘😎🤔😴😭😡👍👎👏🙏💪🔥❤️💔💯🎉🎄🎅⛄❄️⭐🌙☀️🌈🍕🍔☕🍺🎮⚽🚗✈️🐱🐶🦄👻💀🤖👋✌️🤝👀";
function toggleEmoji(){
  const p=document.getElementById("emoji-panel");
  if(p.style.display==="block"){p.style.display="none";return;}
  if(!p.innerHTML)p.innerHTML=[...EMOJIS].map(e=>`<span class="em" onclick="pickEmoji('${e}')">${e}</span>`).join("");
  p.style.display="block";
}
function pickEmoji(e){
  const i=document.getElementById("msg-input");
  const s=i.selectionStart||i.value.length, en=i.selectionEnd||s;
  i.value=i.value.slice(0,s)+e+i.value.slice(en);
  i.focus();i.selectionStart=i.selectionEnd=s+[...e].length;
}

function join(){
  nick=document.getElementById("nick").value.trim()||t("guest");
  color=document.getElementById("color").value;
  room=document.getElementById("room").value;
  adminPin=document.getElementById("pin").value.trim();
  baseRoom=room;
  localStorage.setItem("et-nick",nick);
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="flex";
  renderRooms();loadMsgs();loadOnline();doPing();
  pollTimer=setInterval(()=>{loadMsgs();loadOnline();},3000);
  setInterval(doPing,30000);
}
function bannedKick(){
  if(pollTimer)clearInterval(pollTimer);
  alert("⛔ Этот ник заблокирован админом ErikTalk");
  document.getElementById("chat").style.display="none";
  document.getElementById("login").style.display="block";
}
async function doPing(){
  try{
    const r=await fetch(`${API}/api/ping`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nick,color,room:baseRoom,pin:adminPin})});
    if(r.status===403)bannedKick();
  }catch(e){}
}
async function loadOnline(){
  try{
    const r=await fetch(`${API}/api/online?room=${encodeURIComponent(baseRoom)}`);
    const users=await r.json();
    document.getElementById("online-list").innerHTML=users.map(u=>`<div class="online-user" data-n="${escq(u.nick)}" title="${t("dmHint")}" onclick="openDM(this.getAttribute('data-n'))" style="color:${esc(u.color)}">● ${esc(u.nick)}${u.admin?'<span class="adm-tag">👑 АДМИН</span>':''}</div>`).join("")||'<div style="opacity:.5;font-size:12px">—</div>';
  }catch(e){}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function escq(s){return esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
async function loadMsgs(){
  try{
    const r=await fetch(`${API}/api/messages?room=${room}&after=${lastId}`);
    const msgs=await r.json();
    const box=document.getElementById("messages");
    msgs.forEach(m=>{
      lastId=Math.max(lastId,m.id);
      const d=new Date(m.ts*1000);
      const tm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
      box.innerHTML+=`<div class="msg"><span class="nick" data-n="${escq(m.nick)}" onclick="openDM(this.getAttribute('data-n'))" title="${t("dmHint")}" style="color:${esc(m.color)}">${esc(m.nick)}</span>${m.admin?'<span class="adm-tag">👑 АДМИН</span>':''}<span class="time">${tm}</span>: ${esc(m.text)}</div>`;
    });
    if(msgs.length)box.scrollTop=box.scrollHeight;
  }catch(e){}
}
async function sendMsg(e){
  e.preventDefault();
  const inp=document.getElementById("msg-input");
  const text=inp.value.trim();
  if(!text)return;
  inp.value="";
  document.getElementById("emoji-panel").style.display="none";
  try{
    const r=await fetch(`${API}/api/messages`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nick,color,text,room,pin:adminPin})});
    if(r.status===403){bannedKick();return;}
    loadMsgs();
  }catch(e){}
}
</script>
</body>
</html>
